[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dispute-agent"
version = "0.1.0"
description = "Call-center dispute agent prototype"
requires-python = ">=3.11"

[project.scripts]
dispute-auth-demo = "dispute_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
