name: Python quality

on:
  pull_request:
    paths:
      - ".github/workflows/python-quality.yml"
      - "visa-dispute-hackathon/**"
  workflow_dispatch:

concurrency:
  group: python-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: visa-dispute-hackathon

jobs:
  lint-and-test:
    name: Ruff and tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          working-directory: visa-dispute-hackathon
          python-version: "3.11"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run coverage run --source=dispute_agent -m unittest discover -s tests -v

      - name: Enforce coverage floor
        run: uv run coverage report --show-missing --fail-under=75

      - name: Export coverage reports
        run: |
          uv run coverage xml
          uv run coverage json

      - name: Publish coverage to Codecov
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5
        with:
          files: visa-dispute-hackathon/coverage.xml
          flags: python
          name: dispute-agent
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Report cyclomatic complexity
        run: uv run radon cc dispute_agent -e "* 2.py" -s -a

      - name: Report maintainability index
        run: uv run radon mi dispute_agent -e "* 2.py" -s
