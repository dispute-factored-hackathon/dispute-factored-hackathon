name: SonarQube Cloud

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  sonar:
    name: SonarQube quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ vars.SONAR_ENABLED == 'true' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: visa-dispute-hackathon
          python-version: "3.11"
          enable-cache: true

      - name: Generate coverage XML
        working-directory: visa-dispute-hackathon
        run: |
          uv sync --locked --dev
          uv run coverage run --source=dispute_agent -m unittest discover -s tests
          uv run coverage xml

      - name: Analyze source and pull request
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
