name: Deploy AWS voice demo

on:
  release:
    types: [published]
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

concurrency:
  group: deploy-aws-demo
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  validate-and-deploy:
    name: Validate and deploy to São Paulo
    if: >-
      ${{
        (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
        github.event_name == 'release' ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: visa-dispute-hackathon
    env:
      AWS_REGION: sa-east-1
      AWS_ACCOUNT_ID: "832271495954"
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Check out the deployed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.event.release.tag_name || github.sha }}
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          working-directory: visa-dispute-hackathon
          python-version: "3.11"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Validate Python
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .
          uv run python -m unittest discover -s tests -v

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: sa-east-1
          allowed-account-ids: "832271495954"
          role-session-name: github-dispute-demo

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Validate CloudFormation templates
        run: |
          aws cloudformation validate-template --template-body file://infra/aws/bootstrap.yaml >/dev/null
          aws cloudformation validate-template --template-body file://infra/aws/application.yaml >/dev/null

      - name: Build, push, and deploy
        run: ./infra/aws/deploy.sh application

      - name: Verify the protected webhook
        run: |
          webhook_url="$(aws cloudformation describe-stacks \
            --stack-name dispute-factored-demo \
            --query "Stacks[0].Outputs[?OutputKey=='OpenAIWebhookUrl'].OutputValue" \
            --output text)"
          status="$(curl --silent --output response.json --write-out '%{http_code}' \
            --max-time 60 \
            --request POST \
            --header 'content-type: application/json' \
            --data '{"type":"realtime.call.incoming"}' \
            "${webhook_url}")"
          test "${status}" = "400"
          grep -q 'invalid_webhook_signature' response.json
          echo "Protected webhook smoke test passed."

      - name: Publish deployment summary
        if: ${{ success() }}
        run: |
          webhook_url="$(aws cloudformation describe-stacks \
            --stack-name dispute-factored-demo \
            --query "Stacks[0].Outputs[?OutputKey=='OpenAIWebhookUrl'].OutputValue" \
            --output text)"
          {
            echo '## AWS voice demo deployed'
            echo
            echo "- Region: \`${AWS_REGION}\`"
            echo "- Revision: \`${GITHUB_SHA}\`"
            echo "- Webhook: ${webhook_url}"
            echo '- Smoke test: unsigned requests are rejected as expected.'
          } >> "${GITHUB_STEP_SUMMARY}"
