# Data contract specification for bronze branches table
dataset: lakehouse/bronze/branches

variables:
  LOAD_IDS:

# Scope the contract to a single delivery (one contract run = one load)
filter: "list_contains(string_split('${var.LOAD_IDS}', ','), _dlt_load_id)"

checks:
  - schema:
      allow_extra_columns: false
      allow_other_column_order: true
  - row_count:

  # Exactly one distinct snapshot_ts per load
  # NOTE: verify the v4 `metric` syntax (expression vs query), same open point as customers
  - metric:
      name: Exactly one distinct snapshot_ts per load
      expression: COUNT(DISTINCT snapshot_ts)
      threshold:
        must_be: 1

  # Date coherence (warn only: rows are kept and flagged in silver)
  - failed_rows:
      name: branch_opening_date later than snapshot_ts
      expression: TRY_CAST(branch_opening_date AS TIMESTAMP)::DATE > snapshot_ts
      threshold:
        level: warn

columns:
  - name: branch_id
    data_type: VARCHAR
    checks:
      - missing:
      - duplicate:
      - invalid:
          valid_max_length: 20

  - name: branch_code
    data_type: VARCHAR
    checks:
      - missing:
      - duplicate:
      - invalid:
          valid_max_length: 20

  - name: branch_name
    data_type: VARCHAR
    checks:
      - missing:
      - invalid:
          valid_max_length: 100
          valid_format:
            name: Alpha with spaces and accents regex
            regex: '^[A-Z\d\s\-\.]+$'
          column_expression: STRIP_ACCENTS(UPPER(branch_name))

  - name: branch_type
    data_type: VARCHAR
    checks:
      - missing:
      - invalid:
          valid_max_length: 20
          valid_values: ['Corporate', 'Express', 'Main', 'Premium']

  - name: address
    data_type: VARCHAR
    checks:
      - missing:
      - invalid:
          valid_max_length: 200

  - name: city
    data_type: VARCHAR
    checks:
      - missing:
      - invalid:
          valid_max_length: 100
          valid_format:
            name: Alpha with spaces and accents regex
            regex: '^[A-Z\s\-\.]+$'
          column_expression: STRIP_ACCENTS(UPPER(city))

  - name: state
    data_type: VARCHAR
    checks:
      - missing:
      - invalid:
          valid_max_length: 100
          valid_format:
            name: Alpha with spaces and accents regex
            regex: '^[A-Z\s\-\.]+$'
          column_expression: STRIP_ACCENTS(UPPER(state))

  - name: country
    data_type: VARCHAR
    checks:
      - missing:
      - invalid:
          valid_max_length: 50
          valid_values: ['ARGENTINA', 'BRAZIL', 'COLOMBIA', 'MEXICO', 'SPAIN', 'USA']
          column_expression: STRIP_ACCENTS(UPPER(country))

  - name: postal_code
    data_type: VARCHAR
    checks:
      - missing:
      - invalid:
          valid_max_length: 20

  - name: geographic_zone
    data_type: VARCHAR
    checks:
      - missing:
      - invalid:
          valid_max_length: 20
          valid_values: ['Rural', 'Suburban', 'Urban', 'Urbana', 'Suburbana']

  - name: phone
    data_type: VARCHAR
    checks:
      - missing:
          threshold:
            must_be: 0
            level: warn
      - invalid:
          valid_max_length: 30

  - name: email
    data_type: VARCHAR
    checks:
      - missing:
          threshold:
            must_be: 0
            level: warn
      - invalid:
          valid_max_length: 100

  - name: opening_time
    data_type: VARCHAR
    checks:
      - missing:
      - invalid:
          name: Time format check
          valid_format:
            name: Time regex
            regex: '^\d{2}:\d{2}(:\d{2})?$'

  - name: closing_time
    data_type: VARCHAR
    checks:
      - missing:
      - invalid:
          name: Time format check
          valid_format:
            name: Time regex
            regex: '^\d{2}:\d{2}(:\d{2})?$'

  - name: has_atms
    data_type: VARCHAR
    checks:
      - missing:
      - invalid:
          name: Boolean literal format check
          valid_format:
            name: Boolean regex
            regex: '(?i)^(true|false|1|0|t|f)$'
      - failed_rows:
          name: Verify has_atms is castable to BOOLEAN
          expression: "has_atms IS NOT NULL AND TRY_CAST(has_atms AS BOOLEAN) IS NULL"

  - name: atm_count
    data_type: VARCHAR
    checks:
      - missing:
          threshold:
            must_be: 0
            level: warn
      - invalid:
          column_expression: TRY_CAST(atm_count AS INTEGER)
          valid_min: 0
      - failed_rows:
          name: Verify atm_count is castable to INTEGER
          expression: "atm_count IS NOT NULL AND TRY_CAST(atm_count AS INTEGER) IS NULL"

  - name: has_teller_windows
    data_type: VARCHAR
    checks:
      - missing:
      - invalid:
          name: Boolean literal format check
          valid_format:
            name: Boolean regex
            regex: '(?i)^(true|false|1|0|t|f)$'
      - failed_rows:
          name: Verify has_teller_windows is castable to BOOLEAN
          expression: "has_teller_windows IS NOT NULL AND TRY_CAST(has_teller_windows AS BOOLEAN) IS NULL"

  - name: teller_window_count
    data_type: VARCHAR
    checks:
      - missing:
          threshold:
            must_be: 0
            level: warn
      - invalid:
          column_expression: TRY_CAST(teller_window_count AS INTEGER)
          valid_min: 0
      - failed_rows:
          name: Verify teller_window_count is castable to INTEGER
          expression: "teller_window_count IS NOT NULL AND TRY_CAST(teller_window_count AS INTEGER) IS NULL"

  - name: latitude
    data_type: VARCHAR
    checks:
      - missing:
      - invalid:
          qualifier: format
          name: Decimal(10,7) string format check
          valid_format:
            name: Decimal 10_7 regex
            regex: '^-?\d{1,3}(\.\d{1,7})?$'
      - invalid:
          qualifier: range
          column_expression: TRY_CAST(latitude AS DECIMAL(10,7))
          valid_min: -90
          valid_max: 90
      - failed_rows:
          name: Verify latitude is castable to DECIMAL(10,7)
          expression: "latitude IS NOT NULL AND TRY_CAST(latitude AS DECIMAL(10,7)) IS NULL"

  - name: longitude
    data_type: VARCHAR
    checks:
      - missing:
      - invalid:
          qualifier: format
          name: Decimal(10,7) string format check
          valid_format:
            name: Decimal 10_7 regex
            regex: '^-?\d{1,3}(\.\d{1,7})?$'
      - invalid:
          qualifier: range
          column_expression: TRY_CAST(longitude AS DECIMAL(10,7))
          valid_min: -180
          valid_max: 180
      - failed_rows:
          name: Verify longitude is castable to DECIMAL(10,7)
          expression: "longitude IS NOT NULL AND TRY_CAST(longitude AS DECIMAL(10,7)) IS NULL"

  - name: branch_opening_date
    data_type: VARCHAR
    checks:
      - missing:
      - invalid:
          name: Date format check
          valid_format:
            name: Date regex
            regex: '^\d{4}-\d{2}-\d{2}$'
      - failed_rows:
          name: Verify branch_opening_date is castable to DATE
          expression: "branch_opening_date IS NOT NULL AND TRY_CAST(branch_opening_date AS DATE) IS NULL"

  - name: branch_status
    data_type: VARCHAR
    checks:
      - missing:
      - invalid:
          valid_max_length: 30
          valid_values: ['Active', 'Closed', 'Temporarily Closed']

  - name: snapshot_ts
    data_type: DATE
    checks:
      - missing:

  - name: _source_file
    data_type: VARCHAR
    checks:
      - missing:
      - invalid:
          valid_max_length: 255

  - name: _processed_at
    data_type: TIMESTAMP WITH TIME ZONE
    checks:
      - missing:

  - name: _dlt_load_id
    data_type: VARCHAR
    checks:
      - missing:
      - invalid:
          valid_max_length: 64

  - name: _dlt_id
    data_type: VARCHAR
    checks:
      - missing:
      - invalid:
          valid_max_length: 64