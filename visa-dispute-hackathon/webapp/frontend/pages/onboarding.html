<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="description"
        content="Learn how to use the Factored Bank demo."
    >

    <title>Welcome · Factored Bank</title>

    <link
        rel="stylesheet"
        href="/static/css/tokens.css"
    >

    <link
        rel="stylesheet"
        href="/static/css/global.css"
    >

    <link
        rel="stylesheet"
        href="/static/css/components.css"
    >

    <link
        rel="stylesheet"
        href="/static/css/pages/onboarding.css"
    >
</head>

<body>
    <main
        id="onboarding-page"
        class="onboarding-page"
        hidden
    >
        <header class="onboarding-header">
            <a
                class="brand-name"
                href="/home"
            >
                FACTORED BANK
            </a>

            <button
                id="skip-button"
                class="skip-button"
                type="button"
            >
                Skip
            </button>
        </header>

        <div class="tutorial-shell">
            <div class="progress-header">
                <span id="step-counter">
                    1 of 10
                </span>

                <div
                    class="progress-track"
                    aria-hidden="true"
                >
                    <div
                        id="progress-bar"
                        class="progress-bar"
                    ></div>
                </div>
            </div>

            <section
                id="tutorial-content"
                class="tutorial-content"
                aria-live="polite"
            >
                <p
                    id="step-eyebrow"
                    class="step-eyebrow"
                ></p>

                <h1 id="step-title"></h1>

                <div
                    id="step-body"
                    class="step-body"
                ></div>

                <div
                    id="step-highlight"
                    class="step-highlight"
                    hidden
                ></div>

                <a
                    id="step-link"
                    class="
                        tutorial-link
                        button
                        button-secondary
                    "
                    href="/home"
                    hidden
                ></a>
            </section>

            <footer class="tutorial-controls">
                <button
                    id="previous-button"
                    class="
                        button
                        button-secondary
                    "
                    type="button"
                >
                    Previous
                </button>

                <button
                    id="next-button"
                    class="
                        button
                        button-primary
                    "
                    type="button"
                >
                    Next
                </button>
            </footer>
        </div>
    </main>

    <dialog
        id="skip-dialog"
        class="skip-dialog"
    >
        <div class="skip-dialog-content">
            <p class="dialog-eyebrow">
                SKIP TUTORIAL?
            </p>

            <h2>
                You can replay it later.
            </h2>

            <p>
                The tutorial will always be available
                from your Factored Bank home page.
            </p>

            <div class="dialog-actions">
                <button
                    id="keep-learning-button"
                    class="
                        button
                        button-secondary
                    "
                    type="button"
                >
                    Keep learning
                </button>

                <button
                    id="confirm-skip-button"
                    class="
                        button
                        button-primary
                    "
                    type="button"
                >
                    Skip tutorial
                </button>
            </div>
        </div>
    </dialog>

    <script
        type="module"
        src="/static/js/pages/onboarding.js"
    ></script>
</body>
</html>
