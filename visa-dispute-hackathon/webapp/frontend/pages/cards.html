<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="description"
        content="Manage your Factored Bank cards."
    >

    <title>Cards · Factored Bank</title>

    <link rel="icon" type="image/svg+xml" href="/static/assets/favicons/factored-bank.svg">

    <link
        rel="stylesheet"
        href="/static/css/tokens.css"
    >

    <link
        rel="stylesheet"
        href="/static/css/global.css"
    >

    <link
        rel="stylesheet"
        href="/static/css/components.css?v=2"
    >

    <link
        rel="stylesheet"
        href="/static/css/pages/cards.css"
    >
</head>

<body>
    <main
        id="cards-page"
        class="cards-page"
        hidden
    >
        <header class="app-header">
            <a
                class="back-link"
                href="/home"
                aria-label="Back to home"
                data-history-back
            >
                ←
            </a>

            <a
                class="brand-name"
                href="/home"
            >
                FACTORED BANK
            </a>

            <a
                class="profile-button"
                href="/profile"
                aria-label="Open profile"
            >
                <span
                    id="profile-initial"
                    aria-hidden="true"
                >
                    F
                </span>
            </a>
        </header>

        <div class="cards-content">
            <header class="page-heading">
                <p class="eyebrow">
                    YOUR BANKING
                </p>

                <h1>
                    Cards
                </h1>

                <p>
                    View your cards and quickly block
                    one if you think it may be
                    compromised.
                </p>
            </header>

            <div
                id="page-error"
                class="page-error"
                role="alert"
                hidden
            ></div>

            <section
                id="cards-list"
                class="cards-list"
                aria-label="Your cards"
                aria-live="polite"
            ></section>

            <section
                id="empty-state"
                class="empty-state"
                hidden
            >
                <h2>
                    No cards yet
                </h2>

                <p>
                    There are no cards associated
                    with this Factored Bank account.
                </p>
            </section>
        </div>

        <nav
            id="bottom-nav"
            class="bottom-nav"
            aria-label="Primary navigation"
        ></nav>
    </main>

    <dialog
        id="status-dialog"
        class="status-dialog"
        aria-labelledby="dialog-title"
    >
        <div class="status-dialog-content">
            <p
                id="dialog-eyebrow"
                class="dialog-eyebrow"
            >
                CARD SECURITY
            </p>

            <h2 id="dialog-title">
                Block this card?
            </h2>

            <p id="dialog-description"></p>

            <div class="dialog-actions">
                <button
                    id="dialog-cancel"
                    class="
                        button
                        button-secondary
                    "
                    type="button"
                >
                    Cancel
                </button>

                <button
                    id="dialog-confirm"
                    class="
                        button
                        button-primary
                    "
                    type="button"
                >
                    Confirm
                </button>
            </div>
        </div>
    </dialog>

    <script type="module" src="/static/js/components/history-back.js?v=1"></script>

    <script
        type="module"
        src="/static/js/pages/cards.js?v=20261005-onboarding-empty2"
    ></script>
</body>
</html>
