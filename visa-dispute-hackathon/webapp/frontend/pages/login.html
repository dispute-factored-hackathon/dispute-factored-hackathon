<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="description"
        content="Sign in to your Factored Bank demo account."
    >

    <title>Sign in · Factored Bank</title>

    <link
        rel="stylesheet"
        href="/static/css/tokens.css"
    >

    <link
        rel="stylesheet"
        href="/static/css/global.css"
    >

    <link
        rel="stylesheet"
        href="/static/css/pages/login.css"
    >
</head>

<body>
    <main class="login-page">
        <section class="login-container">

            <header class="brand">
                <p class="brand-name">
                    FACTORED BANK
                </p>
            </header>

            <div class="login-copy">
                <p class="eyebrow">
                    DEMO BANKING
                </p>

                <h1>
                    Welcome back.
                </h1>

                <p>
                    Enter your six-digit Factored ID
                    to access your demo account.
                </p>
            </div>

            <div class="login-card">
                <form
                    id="login-form"
                    class="login-form"
                    novalidate
                >
                    <div
                        id="login-error"
                        class="form-error"
                        role="alert"
                        hidden
                    ></div>

                    <div class="form-field">
                        <label for="factored-id">
                            Factored ID
                        </label>

                        <input
                            id="factored-id"
                            name="factoredId"
                            type="text"
                            inputmode="numeric"
                            autocomplete="one-time-code"
                            maxlength="6"
                            pattern="[0-9]{6}"
                            placeholder="123456"
                            required
                        >

                        <p class="field-help">
                            This is the six-digit ID
                            generated when you created
                            your account.
                        </p>
                    </div>

                    <button
                        id="login-button"
                        class="
                            button
                            button-primary
                        "
                        type="submit"
                    >
                        Sign in
                    </button>
                </form>

                <div class="signup-link">
                    <span>
                        Don't have a demo account?
                    </span>

                    <a href="/signup">
                        Create one
                    </a>
                </div>
            </div>

        </section>
    </main>

    <script
        type="module"
        src="/static/js/pages/login.js"
    ></script>
</body>
</html>
