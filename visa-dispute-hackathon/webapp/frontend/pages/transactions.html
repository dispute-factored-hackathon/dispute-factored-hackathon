<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="description"
        content="View your Factored Bank transactions."
    >

    <title>Transactions · Factored Bank</title>

    <link rel="icon" type="image/svg+xml" href="/static/assets/favicons/factored-bank.svg">

    <link
        rel="stylesheet"
        href="/static/css/tokens.css"
    >

    <link
        rel="stylesheet"
        href="/static/css/global.css"
    >

    <link
        rel="stylesheet"
        href="/static/css/components.css?v=5"
    >

    <link
        rel="stylesheet"
        href="/static/css/pages/transactions.css"
    >
</head>

<body>
    <main
        id="transactions-page"
        class="transactions-page"
        hidden
    >
        <header class="app-header">
            <a
                class="back-link"
                href="/home"
                aria-label="Factored Bank home"
            >
                <svg class="bank-home-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M3 10.5 12 3l9 7.5"></path>
                    <path d="M5.5 9.5V21h13V9.5M9 21v-7h6v7"></path>
                </svg>
            </a>

            <a
                class="brand-name"
                href="/home"
            >
                FACTORED BANK
            </a>

            <a
                class="profile-button"
                href="/profile"
                aria-label="Open profile"
            >
                <span
                    id="profile-initial"
                    aria-hidden="true"
                >
                    F
                </span>
            </a>
        </header>

        <div class="transactions-content">
            <header class="page-heading">
                <p class="eyebrow">
                    ACTIVITY
                </p>

                <h1>
                    Transactions
                </h1>

                <p>
                    Review your recent purchases and
                    report anything that doesn't look
                    right.
                </p>
            </header>

            <div
                id="page-error"
                class="page-error"
                role="alert"
                hidden
            ></div>

            <section
                id="fraud-notice"
                class="fraud-notice"
                hidden
            >
                <div>
                    <strong>
                        Something may need your attention
                    </strong>

                    <p>
                        We found transaction activity
                        marked as suspicious in this
                        demo account.
                    </p>
                </div>
            </section>

            <section
                id="transactions-list"
                class="transactions-list"
                aria-label="Transaction history"
                aria-live="polite"
            ></section>

            <section
                id="empty-state"
                class="empty-state"
                hidden
            >
                <h2>
                    No transactions yet
                </h2>

                <p>
                    Your transaction history will
                    appear here.
                </p>
            </section>
        </div>

        <nav
            id="bottom-nav"
            class="bottom-nav"
            aria-label="Primary navigation"
        ></nav>
    </main>

    <script
        type="module"
        src="/static/js/pages/transactions.js?v=20261001-i18n1"
    ></script>
</body>
</html>
