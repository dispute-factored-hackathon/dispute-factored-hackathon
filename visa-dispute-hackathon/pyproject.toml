[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "dispute-agent"
version = "0.1.0"
description = "Call-center dispute agent prototype"
requires-python = ">=3.11"

dependencies = [
    "alembic>=1.13,<2",
    "certifi>=2026.7.22",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "langchain-openai>=0.3,<2",
    "langgraph>=0.4,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "langsmith>=0.3,<1",
    "mangum>=0.19,<1",
    "openai>=3.19,<4",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic-settings>=2,<3",
    "python-dotenv>=1,<2",
    "uvicorn>=0.30,<1",
    "websockets>=15,<17",
]


[project.scripts]
dispute-sip-server = "dispute_agent.sip_realtime:run"
dispute-db-migrate = "webapp.backend.db.migrate:main"
dispute-db-seed-lakehouse = "webapp.backend.db.seed_lakehouse:main"


[project.optional-dependencies]
analytics = [
    "duckdb>=1.5.5",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "seaborn>=0.13.2",
    "wordcloud>=1.9.6",
]


[tool.setuptools.packages.find]
where = ["."]
include = [
    "dispute_agent*",
    "webapp*",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]


[tool.uv]
package = true


[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "ipykernel>=6,<7",
    "jupyterlab>=4,<5",
    "matplotlib-inline>=0.1,<1",
    "pytest>=9.1.1",
    "radon>=6.0.1",
    "ruff>=0.14,<1",
]


[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "B",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "ISC",
    "RUF",
    "SIM",
    "UP",
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
