[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dispute-agent"
version = "0.1.0"
description = "Call-center dispute agent prototype"
requires-python = ">=3.11"
dependencies = [
  "langchain-openai>=0.3,<2",
  "langgraph>=0.4,<2",
  "langsmith>=0.3,<1",
  "python-dotenv>=1,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dispute_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
omit = ["**/* 2.py"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "radon>=6.0.1",
    "ruff>=0.14,<1",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["src", "**/* 2.py"]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "ISC", "RUF", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
