[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dispute-agent"
version = "0.1.0"
description = "Call-center dispute agent prototype"
requires-python = ">=3.11"
dependencies = [
  "langchain-openai>=0.3,<2",
  "langgraph>=0.4,<2",
  "python-dotenv>=1,<2",
]

[project.scripts]
dispute-auth-demo = "dispute_agent.cli:main"
dispute-auth-setup = "dispute_agent.model_setup:main"
dispute-agent-eval = "dispute_agent.evaluation:main"

[project.optional-dependencies]
ml = [
  "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "langid==1.1.6",
  "sentencepiece>=0.2.0",
  "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "torch>=2.4.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "transformers>=4.41.0,<5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dispute_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "ruff>=0.14,<1",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["src"]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "ISC", "RUF", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
