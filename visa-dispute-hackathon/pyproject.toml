[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dispute-agent"
version = "0.1.0"
description = "Call-center dispute agent prototype"
requires-python = ">=3.11"
dependencies = [
  "langchain-openai>=0.3,<2",
  "langgraph>=0.4,<2",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
ml = [
  "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "langid==1.1.6",
  "sentencepiece>=0.2.0",
  "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "torch>=2.4.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "transformers>=4.41.0,<5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dispute_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = true
