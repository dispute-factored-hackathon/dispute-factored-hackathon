<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bank Factored · Dispute demo</title>
    <style>
      :root { font-family: Inter, system-ui, sans-serif; color: #0f172a; background: #eef2ff; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(560px, 100%); background: white; padding: 40px; border-radius: 24px; box-shadow: 0 20px 60px #312e8120; }
      .eyebrow { color: #4f46e5; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; font-size: .75rem; }
      h1 { margin: 10px 0 8px; font-size: clamp(1.8rem, 5vw, 2.5rem); }
      p { color: #475569; line-height: 1.55; }
      label { display: block; font-weight: 700; margin: 28px 0 8px; }
      input, button { font: inherit; }
      input { width: 100%; padding: 14px 16px; border: 1px solid #cbd5e1; border-radius: 12px; }
      input:focus { outline: 3px solid #c7d2fe; border-color: #4f46e5; }
      [role=listbox] { margin: 8px 0 18px; padding: 6px; list-style: none; border: 1px solid #e2e8f0; border-radius: 12px; max-height: 260px; overflow: auto; }
      [role=option] { padding: 12px; border-radius: 8px; cursor: pointer; }
      [role=option][aria-selected=true], [role=option]:hover { background: #eef2ff; }
      small { display: block; color: #64748b; margin-top: 3px; }
      button { width: 100%; padding: 14px; border: 0; border-radius: 12px; color: white; background: #312e81; font-weight: 750; cursor: pointer; }
      button:disabled { opacity: .45; cursor: not-allowed; }
      #status { min-height: 24px; color: #334155; }
      .notice { padding: 12px 14px; background: #fff7ed; color: #9a3412; border-radius: 10px; font-size: .9rem; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Bank Factored</div>
      <h1>Choose a demo customer</h1>
      <p>This searchable login uses synthetic hackathon data. It is not real bank authentication.</p>
      <div class="notice">Select a result from the list. Typing a name alone will not sign you in.</div>
      <label for="customer-search">Customer name</label>
      <input id="customer-search" role="combobox" aria-autocomplete="list" aria-controls="customer-options" aria-expanded="false" autocomplete="off" placeholder="Start typing a name">
      <ul id="customer-options" role="listbox" hidden></ul>
      <button id="continue" disabled>Continue</button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script>
      const input = document.querySelector('#customer-search');
      const list = document.querySelector('#customer-options');
      const button = document.querySelector('#continue');
      const status = document.querySelector('#status');
      let options = [], selected = null, active = -1, timer, request = 0;

      function render() {
        list.replaceChildren(...options.map((option, index) => {
          const item = document.createElement('li');
          item.id = `customer-${index}`;
          item.role = 'option';
          item.ariaSelected = String(index === active);
          item.innerHTML = `<strong></strong><small></small>`;
          item.querySelector('strong').textContent = option.display_name;
          item.querySelector('small').textContent = option.disambiguation || '';
          item.addEventListener('mousedown', event => { event.preventDefault(); choose(index); });
          return item;
        }));
        list.hidden = options.length === 0;
        input.ariaExpanded = String(options.length > 0);
        input.setAttribute('aria-activedescendant', active >= 0 ? `customer-${active}` : '');
      }

      function choose(index) {
        selected = options[index]; active = index;
        input.value = selected.display_name;
        button.disabled = false;
        list.hidden = true; input.ariaExpanded = 'false';
      }

      async function search() {
        const current = ++request;
        const response = await fetch(`/api/customers?query=${encodeURIComponent(input.value)}`);
        if (current !== request) return;
        options = (await response.json()).options; active = options.length ? 0 : -1;
        status.textContent = options.length ? '' : 'No customers found. Try another name.';
        render();
      }

      input.addEventListener('input', () => {
        selected = null; button.disabled = true; clearTimeout(timer); timer = setTimeout(search, 180);
      });
      input.addEventListener('focus', search);
      input.addEventListener('keydown', event => {
        if (!options.length) return;
        if (event.key === 'ArrowDown') { event.preventDefault(); active = (active + 1) % options.length; render(); }
        if (event.key === 'ArrowUp') { event.preventDefault(); active = (active - 1 + options.length) % options.length; render(); }
        if (event.key === 'Enter') { event.preventDefault(); choose(Math.max(active, 0)); }
        if (event.key === 'Escape') { list.hidden = true; input.ariaExpanded = 'false'; }
      });
      button.addEventListener('click', async () => {
        button.disabled = true; status.textContent = 'Starting your synthetic session…';
        const response = await fetch('/api/session', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({selection_token: selected.selection_token}) });
        if (!response.ok) { selected = null; status.textContent = 'That selection expired. Search and select the customer again.'; return; }
        const session = await response.json();
        document.documentElement.lang = session.language;
        status.textContent = `Signed in as ${session.display_name}. Language: ${session.locale}. The transaction experience is the next demo step.`;
      });
    </script>
  </body>
</html>
